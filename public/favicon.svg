<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#f0f9fb" stroke="#0d7a8a" stroke-width="2"/>

  <!-- Hexagon outer ring -->
  <polygon
    points="50,14 80,31 80,67 50,84 20,67 20,31"
    fill="none"
    stroke="#0d7a8a"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Bonds from center to each node -->
  <line x1="50" y1="50" x2="50" y2="14"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="80" y2="31"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="80" y2="67"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="84"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="20" y2="67"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="20" y2="31"  stroke="#0d7a8a" stroke-width="4" stroke-linecap="round"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="11" fill="#0d7a8a"/>

  <!-- Corner nodes: top & bottom = gold, sides = teal -->
  <!-- Top -->
  <circle cx="50" cy="14" r="8" fill="#c9983a"/>
  <!-- Bottom -->
  <circle cx="50" cy="84" r="8" fill="#c9983a"/>
  <!-- Top-right -->
  <circle cx="80" cy="31" r="8" fill="#0d7a8a"/>
  <!-- Bottom-right -->
  <circle cx="80" cy="67" r="8" fill="#0d7a8a"/>
  <!-- Bottom-left -->
  <circle cx="20" cy="67" r="8" fill="#0d7a8a"/>
  <!-- Top-left -->
  <circle cx="20" cy="31" r="8" fill="#0d7a8a"/>
</svg>